<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
        }
        header {
            background: #172554;
            padding: 25px;
        }
        main {
            padding: 70px 20px;
        }
        h1 {
            color: #60a5fa;
            font-size: 38px;
        }
        .card {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 14px;
        }
        .badge {
            display: inline-block;
            margin: 6px;
            padding: 10px 15px;
            background: #166534;
            border-radius: 8px;
        }
        footer {
            padding: 20px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <header>
        <h2>MY DEVOPS PORTFOLIO</h2>
    </header>
    <main>
        <h1>My First Docker Project!</h1>
        <p>Learning Linux, Docker, AWS and DevOps step by step.</p>
        <div class="card">
            <h2>Technologies I'm Learning</h2>
            <span class="badge">Docker</span>
            <span class="badge">Linux</span>
            <span class="badge">AWS</span>
            <span class="badge">DevOps</span>
            <p>This website runs inside a Docker container.</p>
        </div>
    </main>
    <footer>
        Built as my first hands-on DevOps portfolio project.
    </footer>
</body>
</html>
